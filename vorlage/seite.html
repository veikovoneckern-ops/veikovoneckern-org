<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{titel_voll}}</title>
<meta name="description" content="{{beschreibung}}">
<link rel="canonical" href="{{kanonisch}}">
<meta property="og:title" content="{{titel}}">
<meta property="og:description" content="{{beschreibung}}">
<meta property="og:url" content="{{kanonisch}}">
{{og_bild}}
<link rel="icon" href="/bilder/favicon.png">
<link rel="stylesheet" href="/stil.css?v={{stand}}">
</head>
<body>
<header class="kopf"><div class="kopf-innen">
  <a class="marke" href="/" aria-label="Startseite"><img src="/bilder/vveorg-logo-white-background.png" alt="VVEORG"></a>
  <button class="menuknopf" aria-label="Menü" aria-expanded="false" aria-controls="nav"><span></span><span></span><span></span></button>
  <nav id="nav" class="nav">
{{navigation}}
  </nav>
</div></header>
<main>
{{inhalt}}
</main>
<footer class="fuss">
  <p>© {{jahr}} {{name}} · Alle Rechte vorbehalten</p>
</footer>
<script>
// Menü auf dem Telefon auf- und zuklappen; Untermenüs per Tippen öffnen
(function () {
  var k = document.querySelector('.menuknopf'), n = document.getElementById('nav');
  k.addEventListener('click', function () {
    var auf = n.classList.toggle('offen');
    k.setAttribute('aria-expanded', auf ? 'true' : 'false');
  });
  document.querySelectorAll('.nav .klapp').forEach(function (b) {
    b.addEventListener('click', function () {
      var li = b.closest("li"), auf = li.classList.toggle("offen");
      b.setAttribute('aria-expanded', auf ? 'true' : 'false');
    });
  });
})();

// Parallax wie im one.com-Original (dieselbe Rechnung): Das Bild ist 1,6-mal so
// hoch wie das Band (CSS) und wird verschoben, während das Band durch das Fenster
// läuft — von +Spielraum/2 (Band kommt unten herein) bis -Spielraum/2 (Band geht
// oben hinaus). Nur am Rechner, wie im Original; die Bedingung ist dieselbe wie
// im CSS.
(function () {
  var rechner = matchMedia('(hover: hover) and (pointer: fine) and (min-width: 1024px)');
  var bilder = [].slice.call(document.querySelectorAll('.band[data-effekt="parallax"] .band-bild'));
  if (!bilder.length) return;
  var wartet = false;
  function rechnen() {
    wartet = false;
    var vh = innerHeight;
    bilder.forEach(function (bild) {
      if (!rechner.matches) { bild.style.transform = ''; return; }
      var band = bild.parentElement.getBoundingClientRect();
      if (band.bottom < 0 || band.top > vh) return;
      var bildHoehe = band.height * 1.6;
      var spielraum = bildHoehe - band.height;
      var bildOben = band.top - spielraum / 2;                 // ohne Verschiebung
      var anteil = (vh - bildOben) / (vh + bildHoehe);         // 0 … 1
      var y = spielraum / 2 - anteil * spielraum;
      bild.style.transform = 'translate3d(0,' + y.toFixed(1) + 'px,0)';
    });
  }
  addEventListener('scroll', function () { if (!wartet) { wartet = true; requestAnimationFrame(rechnen); } }, { passive: true });
  addEventListener('resize', rechnen);
  rechnen();
})();
</script>
</body>
</html>

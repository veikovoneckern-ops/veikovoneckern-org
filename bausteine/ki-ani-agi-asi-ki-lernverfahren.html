
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KI-Lernverfahren · Interaktive Baumstruktur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ═══════════════════════════════════════════
   DESIGN TOKENS
═══════════════════════════════════════════ */
:root {
  --bg:         #090f1a;
  --surface-1:  #131720;
  --surface-2:  #1a1f2e;
  --border:     rgba(80,140,190,0.22);
  --border-hi:  rgba(100,180,220,0.55);
  --text:       #dde2ee;
  --text-dim:   #8a94aa;
  --text-mute:  #5a6478;
  --accent:     #5ab0cc;
  --accent2:    #70c8e0;
  --root-fill:  #0f2240;
  --l2-fill:    #122030;
  --l3-fill:    #0e1828;
  --mono:  'Share Tech Mono', monospace;
  --head:  'Rajdhani', sans-serif;
  --body:  'Inter', sans-serif;

  /* fluid spacing */
  --gap:    clamp(8px, 1.4vw, 16px);
  --radius: 6px;
  --pad-x:  clamp(14px, 3vw, 32px);
}

/* ═══════════════════════════════════════════
   RESET & BASE
═══════════════════════════════════════════ */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
  min-height: 100vh;
  overflow-x: hidden;
  line-height: 1.5;
}

/* ── background effects ── */
body::before {
  content: '';
  position: fixed; inset: 0;
  background-image:
    linear-gradient(rgba(80,120,200,0.07) 1px, transparent 1px),
    linear-gradient(90deg, rgba(80,120,200,0.07) 1px, transparent 1px);
  background-size: 48px 48px;
  pointer-events: none; z-index: 0;
}
body::after {
  content: '';
  position: fixed; inset: 0;
  background: radial-gradient(ellipse 80% 55% at 50% 0%, rgba(30,50,120,0.2) 0%, transparent 65%);
  pointer-events: none; z-index: 0;
}
.scanlines {
  position: fixed; inset: 0;
  background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.025) 3px, rgba(0,0,0,0.025) 4px);
  pointer-events: none; z-index: 1;
}

/* ═══════════════════════════════════════════
   LAYOUT
═══════════════════════════════════════════ */
.page {
  position: relative; z-index: 2;
  max-width: 1300px; margin: 0 auto;
  padding: 0 var(--pad-x) clamp(60px,10vh,100px);
}

/* ═══════════════════════════════════════════
   HEADER
═══════════════════════════════════════════ */
header {
  text-align: center;
  padding: clamp(32px,6vh,64px) 0 clamp(28px,5vh,52px);
}
.header-eyebrow {
  font-family: var(--mono);
  font-size: clamp(9px,1.5vw,11px);
  letter-spacing: 0.22em;
  color: var(--text-mute);
  text-transform: uppercase;
  margin-bottom: 16px;
  display: flex; align-items: center; justify-content: center; gap: 12px;
}
.header-eyebrow::before, .header-eyebrow::after {
  content: ''; height: 1px; width: clamp(24px,5vw,48px);
  background: linear-gradient(90deg, transparent, var(--border-hi));
}
.header-eyebrow::after { background: linear-gradient(90deg, var(--border-hi), transparent); }

h1 {
  font-family: var(--head);
  font-size: clamp(28px, 5.5vw, 62px);
  font-weight: 700; letter-spacing: 0.04em;
  color: #fff; line-height: 1.06;
  margin-bottom: 12px;
  text-shadow: 0 0 80px rgba(74,158,255,0.18);
}
h1 em { color: hsl(210, 72%, 32%); font-style: normal; text-shadow: 0 0 40px hsl(210,60%,22%); }
h1 .ki { color: hsl(215, 8%, 42%); }

.header-sub {
  font-family: var(--mono);
  font-size: clamp(9px,1.4vw,11px);
  letter-spacing: 0.14em; color: var(--text-mute);
  text-transform: uppercase; margin-bottom: 14px;
}
.header-hint {
  font-size: clamp(12px,1.6vw,14px);
  color: var(--text-dim); font-style: italic;
}

/* ═══════════════════════════════════════════
   ── SHARED NODE STYLES ──
═══════════════════════════════════════════ */
.node {
  cursor: pointer;
  border-radius: var(--radius);
  transition: box-shadow .2s, border-color .2s, background .2s;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}
.node:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.node-label {
  font-family: var(--head);
  font-weight: 700; text-transform: uppercase;
  line-height: 1.25;
}
.node-sub {
  font-family: var(--mono);
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--text-mute);
}
.badge {
  display: inline-block;
  font-family: var(--mono);
  color: var(--accent2);
  border: 1px solid rgba(0,212,170,0.32);
  border-radius: 2px;
  line-height: 1;
}

/* ═══════════════════════════════════════════
   ── DESKTOP / TABLET TREE (≥ 640px) ──
═══════════════════════════════════════════ */
.tree-wrap { display: block; }
.mob-wrap  { display: none; }

/* ─ root ─ */
.t-root {
  background: var(--root-fill);
  border: 2px solid hsl(202, 68%, 56%);
  box-shadow: 0 0 0 1px hsl(202,52%,34%),
              0 0 32px hsl(202,65%,40%,0.30),
              inset 0 1px 0 hsl(202,70%,65%,0.15);
  padding: clamp(12px,2vh,18px) clamp(24px,4vw,52px);
  text-align: center;
}
.t-root:hover {
  border-color: hsl(202, 72%, 64%);
  box-shadow: 0 0 0 1px hsl(202,56%,40%),
              0 0 44px hsl(202,68%,48%,0.42),
              inset 0 1px 0 hsl(202,72%,70%,0.2);
}
.t-root .node-label { font-size: clamp(14px,2.2vw,22px); color: #fff; }
.t-root .node-sub   { font-size: clamp(8px,1vw,10px); color: hsl(202,68%,68%); margin-top: 4px; display:block; }

/* ─ vertical stem from root ─ */
.t-stem {
  width: 1px; height: clamp(20px,3vh,32px); margin: 0 auto;
  background: linear-gradient(180deg, var(--accent) 0%, var(--border-hi) 100%);
}

/* ─ horizontal crossbar ─ */
.t-bar-wrap {
  position: relative; width: 100%;
  display: flex; align-items: flex-start;
  justify-content: center;
  gap: clamp(6px, 1.2vw, 14px);
}
.t-bar-wrap::before {
  content: '';
  position: absolute; top: 0;
  left: calc(var(--pad-x) / 2 + var(--gap));
  right: calc(var(--pad-x) / 2 + var(--gap));
  height: 1px;
  background: linear-gradient(90deg, transparent 0%, var(--border-hi) 8%, var(--border-hi) 92%, transparent 100%);
}

/* ─ L2 column ─ */
.t-col {
  display: flex; flex-direction: column; align-items: center;
  flex: 1; min-width: 0;
}
.t-col-stem {
  width: 1px; height: clamp(16px,2.5vh,26px);
  background: var(--border-hi); flex-shrink: 0;
}

/* ─ L2 node — Lernparadigma: border oben 3px + alle Seiten 1px sichtbar ─ */
.t-l2 {
  width: 100%;
  background: var(--l2-fill);
  border: 1px solid hsl(210,30%,28%);
  border-top: 3px solid hsl(210,60%,52%);
  padding: clamp(10px,1.5vh,14px) clamp(6px,1vw,10px);
  text-align: center; overflow: hidden;
}
.t-l2:hover, .t-l2.active {
  background: #1a2240;
  box-shadow: 0 0 18px rgba(74,158,255,0.14);
}
.t-l2 .node-label { font-size: clamp(9px,1.1vw,13px); color: #fff; }
.t-l2 .node-sub   { font-size: clamp(7px,.85vw,9px); margin-top: 3px; display: block; }
.t-l2 .badge      { font-size: clamp(6px,.8vw,8px); padding: 1px 4px; margin-top: 4px; display: inline-block; }

/* ─ L3 area ─ */
.t-l3-wrap {
  display: flex; flex-direction: column; align-items: center; width: 100%;
}
.t-l3-stem {
  width: 1px; height: clamp(12px,1.8vh,18px);
  background: var(--border); flex-shrink: 0;
}
.t-l3-stack { display: flex; flex-direction: column; gap: clamp(3px,.5vh,5px); width: 100%; }

/* ─ L3 node — Unterverfahren: nur linker Rand farbig (klar schwächer als L2) ─ */
.t-l3 {
  width: 100%;
  background: var(--l3-fill);
  border: 1px solid hsl(210,20%,22%);
  border-left: 3px solid hsl(210,50%,44%);
  border-radius: 3px;
  padding: clamp(6px,1vh,10px) clamp(5px,.8vw,8px);
  text-align: center;
}
.t-l3:hover, .t-l3.active {
  background: #121e28;
  box-shadow: 0 0 10px rgba(80,160,210,0.12);
}
.t-l3 .node-label { font-size: clamp(8px,1vw,11px); color: var(--text); }
.t-l3 .badge      { font-size: clamp(6px,.75vw,8px); padding: 1px 3px; margin-left: 3px; vertical-align: middle; }

/* ═══════════════════════════════════════════
   ── MOBILE ACCORDION (< 640px) ──
═══════════════════════════════════════════ */
.mob-root {
  background: var(--root-fill);
  border: 2px solid hsl(202,68%,56%);
  box-shadow: 0 0 0 1px hsl(202,52%,34%), 0 0 28px hsl(202,65%,40%,0.28);
  border-radius: 8px;
  padding: 18px 20px;
  text-align: center;
  margin-bottom: 18px;
}
.mob-root:active { box-shadow: 0 0 24px rgba(74,158,255,0.2); }
.mob-root .node-label { font-size: 20px; color: #fff; }
.mob-root .node-sub   { font-size: 9px; color: var(--accent); margin-top: 5px; display: block; letter-spacing: 0.15em; text-transform: uppercase; font-family: var(--mono); }

.mob-divider {
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 10px;
}
.mob-divider::before, .mob-divider::after {
  content: ''; flex: 1; height: 1px;
  background: var(--border-hi); opacity: 0.45;
}
.mob-divider span {
  font-family: var(--mono); font-size: 8px; letter-spacing: 0.22em;
  color: var(--text-mute); text-transform: uppercase; white-space: nowrap;
}

/* ─ accordion card ─ */
.acc-card {
  border: 1px solid hsl(210,28%,26%);
  border-top: 3px solid hsl(210,60%,52%);
  border-radius: 6px; margin-bottom: 7px;
  overflow: hidden; background: var(--l2-fill);
}
.acc-head {
  display: flex; align-items: center;
  padding: 15px 15px; gap: 10px; cursor: pointer;
  min-height: 62px;
}
.acc-head:active { background: rgba(74,158,255,0.05); }
.acc-text { flex: 1; }
.acc-text .node-label { font-size: 16px; color: #fff; }
.acc-text .node-sub   { font-size: 9px; margin-top: 3px; display: block; }
.acc-text .badge      { font-size: 8px; padding: 2px 5px; margin-top: 5px; display: inline-block; }
.acc-info {
  background: none; border: 1px solid var(--border); border-radius: 4px;
  color: var(--accent); font-family: var(--mono); font-size: 10px;
  padding: 8px 12px; cursor: pointer; flex-shrink: 0; min-height: 36px;
}
.acc-info:active { background: rgba(74,158,255,0.1); border-color: var(--accent); }
.acc-arrow {
  font-family: var(--mono); font-size: 13px;
  color: var(--text-mute); transition: transform 0.25s; flex-shrink: 0; width: 18px; text-align: center;
}
.acc-card.open .acc-arrow { transform: rotate(90deg); }

/* ─ children list ─ */
.acc-body {
  display: none; flex-direction: column; gap: 5px;
  padding: 4px 12px 12px; background: var(--bg);
  border-top: 1px solid var(--border);
}
.acc-card.open .acc-body { display: flex; }

.acc-child {
  display: flex; align-items: center; gap: 10px;
  padding: 13px 14px; min-height: 50px;
  background: var(--l3-fill);
  border: 1px solid hsl(210,18%,20%);
  border-left: 3px solid hsl(210,50%,44%);
  border-radius: 4px; cursor: pointer;
}
.acc-child:active { background: #121e28; }
.acc-child-label {
  flex: 1; font-family: var(--head); font-size: 14px; font-weight: 600;
  letter-spacing: 0.07em; color: var(--text); text-transform: uppercase;
}
.acc-child-label .badge { font-size: 8px; padding: 1px 4px; margin-left: 6px; vertical-align: middle; }
.acc-child-arrow { font-family: var(--mono); font-size: 12px; color: var(--text-mute); }

/* ─ direct-link cards (no children) ─ */
.acc-card.direct .acc-head { cursor: pointer; }

/* ═══════════════════════════════════════════
   BRANCH COLOR SYSTEM — aus Bildpixeln extrahiert
   Hue-Quelle: Bild mit KI-Gehirn/Cyan-Atmosphäre
   Hues 196–217°, Sät. 22–75 %
   1–5: leuchtendes Blau-Cyan (heller werdend)
   6–7: gedämpftes Blaugrau (heller werdend)
═══════════════════════════════════════════ */

/* 1 · Zone 1 — tiefes Marineblau  #305479-Familie */
[data-branch="1"] {
  --bf:  hsl(210, 55%, 18%);
  --bfh: hsl(210, 62%, 25%);
  --bt:  hsl(204, 60%, 52%);
  --bb:  hsl(208, 42%, 30%);
  --bl:  hsl(204, 56%, 48%);
  --bgl: rgba(48, 112, 172, 0.30);
}
/* 2 · Zone 2 — mittleres Blau  #386e99-Familie */
[data-branch="2"] {
  --bf:  hsl(207, 52%, 21%);
  --bfh: hsl(207, 60%, 28%);
  --bt:  hsl(198, 68%, 58%);
  --bb:  hsl(204, 38%, 34%);
  --bl:  hsl(198, 62%, 54%);
  --bgl: rgba(60, 144, 196, 0.28);
}
/* 3 · Zone 3 — helles Cyan-Blau  #7dbfd6-Familie */
[data-branch="3"] {
  --bf:  hsl(203, 50%, 24%);
  --bfh: hsl(203, 58%, 31%);
  --bt:  hsl(196, 70%, 64%);
  --bb:  hsl(200, 34%, 38%);
  --bl:  hsl(196, 66%, 60%);
  --bgl: rgba(74, 168, 212, 0.27);
}
/* 4 · Zone 4 — hellstes Cyan  Peak-Glow #a0d0e1-Familie */
[data-branch="4"] {
  --bf:  hsl(199, 46%, 27%);
  --bfh: hsl(199, 54%, 34%);
  --bt:  hsl(196, 75%, 72%);
  --bb:  hsl(198, 30%, 42%);
  --bl:  hsl(196, 72%, 67%);
  --bgl: rgba(88, 188, 228, 0.25);
}
/* 5 · Zone 5 — kühleres Cyan  #6babcc-Familie */
[data-branch="5"] {
  --bf:  hsl(200, 44%, 25%);
  --bfh: hsl(200, 52%, 32%);
  --bt:  hsl(200, 65%, 66%);
  --bb:  hsl(200, 28%, 40%);
  --bl:  hsl(200, 60%, 62%);
  --bgl: rgba(80, 172, 214, 0.26);
}
/* 6 · Zone 6 — gedämpftes Blaugrau  #263143-Familie */
[data-branch="6"] {
  --bf:  hsl(216, 24%, 20%);
  --bfh: hsl(216, 30%, 27%);
  --bt:  hsl(207, 44%, 58%);
  --bb:  hsl(212, 18%, 36%);
  --bl:  hsl(207, 40%, 54%);
  --bgl: rgba(100, 132, 160, 0.22);
}
/* 7 · Zone 7 — helles Blaugrau  #243952-Familie */
[data-branch="7"] {
  --bf:  hsl(213, 22%, 25%);
  --bfh: hsl(213, 28%, 32%);
  --bt:  hsl(210, 34%, 68%);
  --bb:  hsl(212, 16%, 42%);
  --bl:  hsl(210, 30%, 63%);
  --bgl: rgba(122, 150, 174, 0.20);
}

/* ── Gemeinsame Regeln ────────────────── */
[data-branch] .t-l2 {
  background:        var(--bf);
  border-color:      var(--bb);          /* alle 4 Seiten sichtbar */
  border-top:        3px solid var(--bt); /* oben dicker & heller  */
}
[data-branch] .t-l2:hover,
[data-branch] .t-l2.active {
  background:   var(--bfh);
  border-color: var(--bt);
  box-shadow:   0 0 26px var(--bgl);
}
[data-branch] .t-col-stem { background: var(--bt); opacity: 0.68; }
[data-branch] .t-l3-stem  { background: var(--bl); opacity: 0.52; }

[data-branch] .t-l3 {
  background:        var(--bf);
  border-color:      hsl(210,20%,22%);   /* sehr dezent, fast unsichtbar */
  border-left:       3px solid var(--bl); /* nur links farbig             */
  filter: brightness(0.84);
}
[data-branch] .t-l3:hover,
[data-branch] .t-l3.active {
  background:        var(--bfh);
  border-left-color: var(--bt);
  box-shadow:        0 0 14px var(--bgl);
  filter: brightness(1);
}

/* ── Mobile Accordion ─────────────────── */
.acc-card[data-branch] {
  background:    var(--bf);
  border-color:  var(--bb);         /* alle 4 Seiten sichtbar */
  border-top:    3px solid var(--bt); /* oben dicker           */
}
.acc-card[data-branch] .acc-body {
  background:  var(--bf);
  filter:      brightness(0.78);
  border-top-color: var(--bb);
}
.acc-card[data-branch] .acc-head:active { background: var(--bfh); }
.acc-card[data-branch] .acc-info {
  color:        var(--bt);
  border-color: var(--bl);
}
.acc-card[data-branch] .acc-info:active {
  background:   var(--bfh);
  border-color: var(--bt);
}
.acc-card[data-branch] .acc-child {
  background:   var(--bf);
  border-color: hsl(210,18%,20%);    /* dezente Ränder       */
  border-left:  3px solid var(--bl); /* nur links farbig     */
  filter: brightness(0.82);
}
.acc-card[data-branch] .acc-child:active {
  background:        var(--bfh);
  border-left-color: var(--bt);
  filter: brightness(1);
}
/* ═══════════════════════════════════════════
   ── DETAIL PANEL (desktop side) ──
═══════════════════════════════════════════ */
#side-panel {
  position: fixed; top: 0; right: 0;
  width: clamp(340px, 32vw, 480px); height: 100vh;
  background: #0e1422;
  border-left: 1px solid var(--border-hi);
  z-index: 300;
  transform: translateX(100%);
  transition: transform .36s cubic-bezier(.22,1,.36,1);
  display: flex; flex-direction: column; overflow: hidden;
}
#side-panel.open { transform: translateX(0); }

/* ─ bottom sheet (mobile) ─ */
#bottom-sheet {
  position: fixed; bottom: 0; left: 0; right: 0;
  height: 86vh;
  background: #0b0f1c;
  border-top: 2px solid var(--accent);
  border-radius: 14px 14px 0 0;
  z-index: 300;
  transform: translateY(100%);
  transition: transform .38s cubic-bezier(.22,1,.36,1);
  display: flex; flex-direction: column; overflow: hidden;
}
#bottom-sheet.open { transform: translateY(0); }

.sheet-drag {
  flex-shrink: 0; display: flex; justify-content: center;
  padding: 10px 0 2px;
}
.sheet-drag-bar {
  width: 38px; height: 4px; border-radius: 2px; background: var(--border-hi);
}

/* ─ shared panel inner ─ */
.panel-hd {
  padding: 18px 20px 16px;
  border-bottom: 1px solid var(--border); flex-shrink: 0;
  background: linear-gradient(180deg, rgba(74,158,255,0.05) 0%, transparent 100%);
  position: relative;
}
.panel-close {
  position: absolute; top: 14px; right: 14px;
  width: 30px; height: 30px;
  background: none; border: 1px solid var(--border); border-radius: 4px;
  color: var(--text-dim); cursor: pointer;
  font-size: 14px; font-family: var(--mono);
  display: flex; align-items: center; justify-content: center;
}
.panel-close:hover, .panel-close:active { border-color: var(--accent); color: var(--accent); }
.panel-type {
  font-family: var(--mono); font-size: 9px; letter-spacing: 0.22em;
  color: var(--text-mute); text-transform: uppercase; margin-bottom: 7px;
}
.panel-title {
  font-family: var(--head); font-size: clamp(18px,2.5vw,24px); font-weight: 700;
  letter-spacing: 0.06em; color: #fff; text-transform: uppercase;
  line-height: 1.15; padding-right: 40px;
}
.panel-body {
  padding: 20px; overflow-y: auto; flex: 1;
  scrollbar-width: thin; scrollbar-color: var(--border) transparent;
  -webkit-overflow-scrolling: touch;
}
.panel-body::-webkit-scrollbar { width: 3px; }
.panel-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* ─ panel content ─ */
.sec-head {
  font-family: var(--mono); font-size: 9px; letter-spacing: 0.22em;
  color: var(--accent); text-transform: uppercase;
  margin-bottom: 10px;
  display: flex; align-items: center; gap: 8px;
}
.sec-head::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.p-desc { font-size: 14px; line-height: 1.78; color: var(--text); margin-bottom: 22px; }
.p-example {
  background: rgba(0,212,170,0.04); border: 1px solid rgba(0,212,170,0.17);
  border-radius: 5px; padding: 14px 16px; margin-bottom: 20px;
}
.p-example p { font-size: 13.5px; line-height: 1.72; color: var(--text); }
.p-tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; margin-bottom: 20px; }
.p-tag {
  font-family: var(--mono); font-size: 10px; letter-spacing: 0.05em;
  color: var(--accent); border: 1px solid rgba(74,158,255,0.24);
  border-radius: 2px; padding: 4px 8px; background: rgba(74,158,255,0.06);
}
.p-apps { display: flex; flex-direction: column; gap: 6px; margin-top: 10px; padding-bottom: 8px; }
.p-app {
  font-size: 13px; color: var(--text-dim);
  padding-left: 14px; position: relative; line-height: 1.5;
}
.p-app::before { content: '→'; position: absolute; left: 0; color: var(--accent2); font-family: var(--mono); font-size: 11px; }

/* ═══════════════════════════════════════════
   OVERLAY
═══════════════════════════════════════════ */
#overlay {
  position: fixed; inset: 0; z-index: 299;
  background: rgba(0,0,0,0.52); opacity: 0; pointer-events: none;
  transition: opacity .28s;
}
#overlay.on { opacity: 1; pointer-events: all; }

/* ═══════════════════════════════════════════
   LEGEND
═══════════════════════════════════════════ */
.legend {
  display: flex; justify-content: center; flex-wrap: wrap; gap: 14px;
  padding: clamp(20px,3vh,28px) 0 0;
  font-family: var(--mono); font-size: clamp(9px,1.2vw,10px); letter-spacing: 0.1em; color: var(--text-mute);
}
.legend-item { display: flex; align-items: center; gap: 6px; }
.leg-dot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0; }
.ld-r { background: #1c2445; border: 1px solid #4a9eff; }
.ld-2 { background: #131a2c; border: 1px solid rgba(74,158,255,0.4); }
.ld-3 { background: #0f1420; border-left: 2px solid rgba(0,212,170,0.5); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); border-right: 1px solid var(--border); }

/* ═══════════════════════════════════════════
   FOOTER
═══════════════════════════════════════════ */
footer {
  position: relative; z-index: 2; text-align: center;
  padding: 26px 20px; border-top: 1px solid var(--border);
  font-family: var(--mono); font-size: 10px;
  letter-spacing: 0.14em; color: var(--text-mute); text-transform: uppercase;
}

/* ═══════════════════════════════════════════
   RESPONSIVE BREAKPOINTS
═══════════════════════════════════════════ */

/* ── mid tablet tweak ── */
@media (max-width: 900px) {
  .t-l2 .node-label { font-size: clamp(8px,1.3vw,11px); }
  .t-l3 .node-label { font-size: clamp(7px,1.1vw,10px); }
  #side-panel { width: min(400px, 48vw); }
}

/* ── switch to accordion below 640px ── */
@media (max-width: 639px) {
  .tree-wrap { display: none; }
  .mob-wrap  { display: block; }
  #side-panel { display: none !important; }
  .page { padding-bottom: 90px; }
}
</style>
</head>

<div class="scanlines"></div>
<div id="overlay"></div>

    <div class="panel-type" id="sp-type"></div>
    <div class="panel-title" id="sp-title"></div>

  </div>
  <div class="panel-body" id="sp-body"></div>
